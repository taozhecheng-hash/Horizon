name: Daily Investment Radar

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 10:00 Asia/Shanghai.
    # Scheduled workflows run only from the default branch.
    - cron: "0 10 * * *"
      timezone: "Asia/Shanghai"

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare investment radar config
        run: cp data/config.investment.example.json data/config.json

      - name: Check DeepSeek secret
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not configured."
            exit 1
          fi

      - name: Run Horizon investment radar
        run: uv run horizon --hours 24

      - name: Upload summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-summary
          path: |
            data/summaries/*.md
            docs/_posts/*.md
          if-no-files-found: warn

      - name: Set current date as environment variable
        if: github.ref_name == github.event.repository.default_branch
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Investment Radar: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
